[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simdrive"
version = "1.0.0b14"
description = "SimDrive — internal MCP server for driving iOS apps in the Simulator with Claude, for bug reproduction and fix validation. Not a commercial product. 36 vision-first tools."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    {name = "SyncTek LLC", email = "info@synctek.io"},
]
keywords = ["ios", "simulator", "mcp", "claude", "testing", "qa", "agent", "anthropic", "automation", "xcuitest", "appium-alternative", "ai-testing", "sampling", "xcode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Floor clears PYSEC-2026-2253/2254/2255/2257/3451 (all HIGH); see commit
    # 85d98fd, which bumped the lock alone and left this pin loose enough to
    # silently drift back on a fresh resolve. Ceiling avoids an unplanned
    # major-version jump.
    "Pillow>=12.3.0,<13.0",
    "boto3>=1.20",
    "email-validator>=2.0",
    "httpx<1.0",  # defensive: mcp 1.27.0 has unbounded httpx>=0.27.1; pip --pre picks httpx 1.0.dev3 which breaks httpx-sse. Remove once upstream mcp pins its own upper bound.
    # Floor carries the CVE-cleared transitive anyio range (CVE-2026-64847,
    # CVE-2026-63374 fixed in anyio 4.14.2). Ceiling stops pip-compile from
    # re-resolving a different mcp/anyio pair on the next lock regen, which
    # is exactly how this pin went stale before.
    "mcp>=1.28.1,<2.0",
    "prometheus-client>=0.19",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Vision>=10.0",
    "pydantic>=2.0",
    "pynacl>=1.6.2",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://simdrive.dev"
Documentation = "https://simdrive.dev"
Repository = "https://github.com/SyncTek-LLC/simdrive"
Source = "https://github.com/SyncTek-LLC/simdrive"
Issues = "https://github.com/SyncTek-LLC/simdrive/issues"
Logo = "https://simdrive.dev/brand/og-image.png"

[project.optional-dependencies]
ssim = ["scikit-image>=0.22"]
claude = [
    "anthropic>=0.30",
]
dev = [
    "anthropic>=0.30",
    "fastapi>=0.115",
    "hypothesis>=6",
    "httpx>=0.24",
    "moto[s3]>=5.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4",
    "ruff>=0.1.0",
    "sqlalchemy>=2.0",
]
cloud = [
    "boto3>=1.20",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "sqlalchemy>=2.0",
    "pynacl>=1.6.2",
    "email-validator>=2.0",
]

[project.scripts]
simdrive = "simdrive.server:serve"
simdrive-mcp = "simdrive.server:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simdrive = ["_bin/simdrive-input", "wda/PINNED_SHA.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that require a booted iOS Simulator and Xcode",
]

[tool.ruff]
line-length = 110
target-version = "py310"
