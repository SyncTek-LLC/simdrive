name: BA Nightly Governance Audit (SpecterQA iOS)

on:
  schedule:
    # 08:00 UTC = 03:00 CST / 04:00 EDT
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  nightly-pr-release-summary:
    name: PR and release drift summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List open PRs
        id: list_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,title,headRefName,author,createdAt \
            --template '{{range .}}PR #{{.number}}: {{.title}} | branch: {{.headRefName}} | author: {{.author.login}} | opened: {{.createdAt}}{{"\n"}}{{end}}' \
            > /tmp/open_prs.txt 2>&1 || echo "No open PRs or gh error" > /tmp/open_prs.txt
          cat /tmp/open_prs.txt

      - name: List recent releases
        id: list_releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 10 \
            > /tmp/recent_releases.txt 2>&1 || echo "No releases or gh error" > /tmp/recent_releases.txt
          cat /tmp/recent_releases.txt

      - name: Check PRs for missing INIT references
        id: init_check
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, os

          INIT_PATTERN = re.compile(r'INIT-\d{4}-\d{3,}', re.IGNORECASE)

          pr_file = pathlib.Path("/tmp/open_prs.txt")
          content = pr_file.read_text() if pr_file.exists() else ""

          violations = []
          for line in content.splitlines():
              line = line.strip()
              if not line or line.startswith("No open"):
                  continue
              if not INIT_PATTERN.search(line):
                  violations.append(f"  MISSING INIT: {line}")

          has_violations = len(violations) > 0

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_violations={'true' if has_violations else 'false'}\n")

          if violations:
              pathlib.Path("/tmp/pr_violations.txt").write_text(
                  "PRs missing INIT reference:\n" + "\n".join(violations)
              )
              print("Violations found:")
              for v in violations:
                  print(v)
          else:
              print("All open PRs appear to have INIT references (or no open PRs).")
          PYEOF

      - name: Build governance drift report
        id: build_report
        run: |
          python3 - <<'PYEOF'
          import pathlib, datetime, os

          today = datetime.date.today()
          pr_content = pathlib.Path("/tmp/open_prs.txt").read_text() if pathlib.Path("/tmp/open_prs.txt").exists() else "N/A"
          rel_content = pathlib.Path("/tmp/recent_releases.txt").read_text() if pathlib.Path("/tmp/recent_releases.txt").exists() else "N/A"
          viol_content = pathlib.Path("/tmp/pr_violations.txt").read_text() if pathlib.Path("/tmp/pr_violations.txt").exists() else ""

          report = f"""# SpecterQA iOS Nightly Governance Audit — {today}

          ## Open Pull Requests
          ```
          {pr_content.strip()}
          ```

          ## Recent Releases
          ```
          {rel_content.strip()}
          ```
          """

          if viol_content:
              report += f"""
          ## Governance Violations
          ```
          {viol_content.strip()}
          ```

          **Action required:** PRs listed above are missing a `INIT-YYYY-NNN` initiative reference.
          """

          pathlib.Path("/tmp/nightly_report.md").write_text(report)
          print(report)

          has_violations = bool(viol_content.strip())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_violations={'true' if has_violations else 'false'}\n")
          PYEOF

      # Dedupe: keep exactly ONE rolling drift issue instead of minting a new one every
      # night. The old step put ${{ github.run_id }} (unique per run) in the title, so
      # create-issue-from-file opened a fresh issue nightly — that produced the 30+
      # duplicate pileup. We now find the open rolling issue by its STABLE title and
      # update it in place; if none is open we create it; and we auto-close it when the
      # drift clears (below), so the tracker reflects live state, not history.
      - name: File or update the rolling drift issue
        if: steps.build_report.outputs.has_violations == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "SpecterQA Nightly Governance Drift"
        run: |
          existing=$(gh issue list --state open --label automated \
            --json number,title \
            --jq '[.[] | select(.title == "SpecterQA Nightly Governance Drift")] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/nightly_report.md
            gh issue comment "$existing" \
              --body "🔄 Drift still present as of run \`${{ github.run_id }}\`. Body updated above."
            echo "Updated rolling drift issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file /tmp/nightly_report.md \
              --label governance,audit,automated
            echo "Opened rolling drift issue"
          fi

      - name: Close the rolling drift issue when drift clears
        if: steps.build_report.outputs.has_violations == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "SpecterQA Nightly Governance Drift"
        run: |
          existing=$(gh issue list --state open --label automated \
            --json number,title \
            --jq '[.[] | select(.title == "SpecterQA Nightly Governance Drift")] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "✅ Governance drift cleared as of run \`${{ github.run_id }}\` — no open PRs missing an INIT reference. Auto-closing the rolling drift issue."
            echo "Closed rolling drift issue #$existing"
          else
            echo "Nightly governance audit complete — no drift detected, no rolling issue open."
          fi
